name: Blue Green Deployment

on:
  push:
    branches:
      - main

env:
  TF_ACTION_WORKING_DIR: terraform

jobs:
  blue-green-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_ACTION_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.TF_ACTION_WORKING_DIR }}

      - name: Blue-Green Deployment Logic
        run: |
          echo "Checking which environment is live..."
          BLUE_LIVE=true

          if [ "$BLUE_LIVE" = true ]; then
            echo "Blue is live"
            echo "Deploying new version to Green"
            echo "Testing Green environment"
            echo "Switching traffic to Green"
          else
            echo "Green is live"
            echo "Deploying new version to Blue"
            echo "Testing Blue environment"
            echo "Switching traffic to Blue"
          fi

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        working-directory: ${{ env.TF_ACTION_WORKING_DIR }}